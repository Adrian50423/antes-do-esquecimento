
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antes do Esquecimento | Arquivo Cultural Africano</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-black: #050505;
            --color-gold: #aa771c;
            --color-gold-light: #fcf6ba;
            --color-brown-dark: #1a0f0a;
            --color-brown: #2d1b0e;
            --color-brown-light: #4a2c16;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-black);
            color: #eee;
            scroll-behavior: smooth;
            overflow-x: hidden;
            background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23aa771c' fill-opacity='0.03'%3E%3Cpath d='M40 40c0-11.046-8.954-20-20-20S0 28.954 0 40s8.954 20 20 20 20-8.954 20-20zm40 0c0-11.046-8.954-20-20-20S40 28.954 40 40s8.954 20 20 20 20-8.954 20-20zM20 0C8.954 0 0 8.954 0 20s8.954 20 20 20 20-8.954 20-20S31.046 0 20 0zm40 0c-11.046 0-20 8.954-20 20s8.954 20 20 20 20-8.954 20-20S71.046 0 60 0z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        .font-serif {
            font-family: 'Playfair Display', serif;
        }

        .gold-gradient {
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .african-divider {
            height: 4px;
            background: repeating-linear-gradient(
                90deg,
                var(--color-gold),
                var(--color-gold) 20px,
                var(--color-brown) 20px,
                var(--color-brown) 40px
            );
            border-radius: 2px;
        }

        .tribal-border {
            border-image: repeating-linear-gradient(
                45deg,
                #aa771c,
                #aa771c 10px,
                transparent 10px,
                transparent 20px
            ) 1;
        }

        .fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px); filter: blur(10px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        @keyframes slideInNav {
            0% { width: 0%; left: 50%; }
            100% { width: 100%; left: 0%; }
        }

        .animate-slide-in-nav {
            animation: slideInNav 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .ancestral-phrase {
            letter-spacing: 0.4em;
            text-transform: uppercase;
            font-weight: 800;
            font-size: 10px;
            color: rgba(170, 119, 28, 0.6);
            text-align: center;
        }

        ::selection {
            background-color: #aa771c;
            color: #000;
        }
    </style>
